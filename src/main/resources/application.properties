server.port=8080
spring.application.name=finance-tracker-app

# H2 in-memory DB - fine for a demo; swap for Postgres/MySQL in real use
spring.datasource.url=jdbc:h2:mem:financedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator - used by Docker/K8s health & readiness probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
