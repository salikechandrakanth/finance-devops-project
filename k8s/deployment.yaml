apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-tracker-app
  labels:
    app: finance-tracker-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finance-tracker-app
  template:
    metadata:
      labels:
        app: finance-tracker-app
    spec:
      containers:
        - name: finance-tracker-app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
